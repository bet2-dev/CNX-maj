<style>
@font-face{font-family:"Lato";font-weight:300;src:url(fonts/Lato-Light.ttf)}
@font-face{font-family:"Lato";font-weight:400;src:url(fonts/Lato-Regular.ttf)}
@font-face{font-family:"Lato";font-weight:600 700;src:url(fonts/Lato-Bold.ttf)}
@font-face{font-family:"Lato";font-style:italic;src:url(fonts/Lato-Italic.ttf)}

@font-face{font-family:"League Spartan";font-weight:700;src:url(fonts/LeagueSpartan-Bold.ttf)}

<style>
/* Layout : appli de terrain mobile-first — liste des fiches, puis éditeur en sections repliables avec barre d'actions fixe en bas */
:root{
  --or:#EF7B1A; --or-ink:#EF7B1A; --or-soft:#FDEBDC; --gr:#464748;
  --bg:#F4F4F4; --card:#FFFFFF; --fg:#464748; --muted:#7A7B7C; --line:#E2E2E2;
  --ok:#1E8A4C; --ok-soft:#E3F4EA; --ko:#C8322B; --ko-soft:#FBE6E4; --so:#7A7C80; --so-soft:#ECECEC;
  --f-ui:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-title:"League Spartan","Lato",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --or:#EF7B1A; --or-ink:#EF7B1A; --or-soft:#3A2614; --gr:#D2D3D4;
  --bg:#121314; --card:#1E1F20; --fg:#F2F2F2; --muted:#A3A4A6; --line:#36383A;
  --ok:#4CC27F; --ok-soft:#173526; --ko:#F06A62; --ko-soft:#3D1D1B; --so:#A9ABAE; --so-soft:#303234; color-scheme:dark}}
:root[data-theme="dark"]{
  --or:#EF7B1A; --or-ink:#EF7B1A; --or-soft:#3A2614; --gr:#D2D3D4;
  --bg:#121314; --card:#1E1F20; --fg:#F2F2F2; --muted:#A3A4A6; --line:#36383A;
  --ok:#4CC27F; --ok-soft:#173526; --ko:#F06A62; --ko-soft:#3D1D1B; --so:#A9ABAE; --so-soft:#303234; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.logo-band{background:#fff;border-bottom:3px solid #EF7B1A}
.logo-band .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-band img{height:46px;width:auto;max-width:62%}
.logo-band .slogan{font-family:var(--f-title);font-weight:700;color:#EF7B1A;font-size:13px;line-height:1.2;white-space:nowrap}
@media (max-width:420px){.logo-band .slogan{font-size:11.5px}.logo-band img{max-width:52%}}
@media (max-width:340px){.logo-band .slogan{display:none}}
.logo-band .t{text-align:right;color:#464748;font-size:12px;line-height:1.25;display:flex;align-items:center;gap:10px}
.thbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid #E2E2E2;background:#fff;color:#464748;display:grid;place-items:center;cursor:pointer}
.thbtn svg{width:20px;height:20px}
.thbtn:focus-visible{outline:3px solid #EF7B1A;outline-offset:2px}
.logo-band .t b{display:block;font-size:15px;color:#464748}
.logo-band .t span{color:#EF7B1A;font-weight:500}
h1{font-size:22px;margin:18px 0 4px;text-wrap:balance}
h1,h2,h3,.sec-h b,.topbar .ttl b,.cat-h,.icard .c,.cpvb .nm,.vbar .vt,.day h3,.ev .c,.login h2,.setup .q b,.btn,.tabbar span,.subnav button,.fchips button,.chip,.dbtn{font-family:var(--f-title);letter-spacing:.01em}
h1{font-weight:700;color:var(--gr)}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:46px}
.btn-or{background:var(--or);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sec-h:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.btn[disabled]{opacity:.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.fcard{padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%}
.fcard .c{font-weight:600;min-width:0;overflow-wrap:anywhere}
.fcard .m{color:var(--muted);font-size:13px;grid-column:1}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;align-self:start}
.chip.draft{background:var(--or-soft);color:var(--or-ink)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.nc{background:var(--ko-soft);color:var(--ko)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.sup-q{width:100%;box-sizing:border-box;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.sup-maj{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.sup-warn{padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--ko);font-size:13.5px}
.sup-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sup-t{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sup-t span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.sup-t b{font-size:26px;font-variant-numeric:tabular-nums}
.sup-d{width:9px;height:9px;border-radius:50%;display:inline-block}.sup-d.ok{background:var(--ok)}.sup-d.ko{background:var(--ko)}.sup-d.off{background:#D9A300}
.sup-c{padding:14px;display:flex;flex-direction:column;gap:8px}.sup-c.is-ko{border-left:4px solid var(--ko)}.sup-c.is-off{border-left:4px solid #D9A300}
.sup-c .ih{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sup-s{margin:0;color:var(--muted);font-size:12.5px}
.sup-al{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.sup-al small{color:var(--muted);font-size:12px}.sup-al .sol{color:var(--fg)}
.sup-al .sev-1{color:var(--ko)}.sup-al .sev-2{color:#B86E00}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
/* éditeur */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{color:var(--muted);font-size:12px}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--or);width:0;transition:width .3s}
.sec{margin-top:12px;overflow:hidden}
.sec-h{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:0;cursor:pointer;text-align:left}
.sec-h .n{background:var(--or);color:#fff;font-weight:700;border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-size:14px}
.sec-h .tt{flex:1;font-weight:600;min-width:0}
.sec-h .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-h .cnt.full{color:var(--ok);font-weight:600}
.sec-h .cnt.hasnc{color:var(--ko);font-weight:600}
.sec-h .chev{transition:transform .2s;color:var(--muted)}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{padding:4px 14px 14px;border-top:1px solid var(--line)}
.sec:not(.open) .sec-b{display:none}
.so-tog{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:10px 0;color:var(--muted)}
.so-tog input{width:22px;height:22px;accent-color:var(--or)}
.sec.isso .items,.sec.isso .photos{opacity:.35;pointer-events:none}
.item{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.item:last-child{border-bottom:0}
.item .q{font-size:14.5px}
.item .h{display:block;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);min-width:56px;min-height:42px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[data-v=SO]{font-size:12.5px;min-width:76px}
.setup{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.setup .q{padding:16px;display:flex;flex-direction:column;gap:10px}
.setup .q b{font-size:15px}
.setup .q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--or);color:#fff;font-size:13px;margin-right:8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:15px;cursor:pointer;color:var(--fg);padding:8px}
.choice button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--or);background:var(--or-soft);color:var(--or-ink)}
.choice button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.setup select{min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);font-size:16px;width:100%}
.setup select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.setup .row2{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:end}
.setup .row2 label,.setup label.lb{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.setup input[type=number]{min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);font-size:16px;width:100%}
.setup .hint{font-size:12.5px;color:var(--muted);margin:0}
.setup .q.off{display:none}
.eqsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:8px 0 10px}
.eqsum div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.eqsum span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.eqsum b{font-size:14px;overflow-wrap:anywhere}
.labels{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.lab{border:1.5px solid var(--gr);border-radius:6px;padding:4px 10px;background:#fff;color:#2B2C2D;font-size:12px;line-height:1.25;text-align:center;min-width:92px;font-weight:700}
.lab small{display:block;font-weight:600;font-size:10.5px}
.lab.dc{background:#FFE14D;border-color:#B08A00}
.lab i{font-style:normal;color:#EF7B1A;font-size:11px}
.cab{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.cab.isnc{border-color:var(--ko)}
.cab .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cab .hd b{font-size:15px}
.cab .hd span{font-size:12.5px;color:var(--muted)}
.cab .in2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cab .in2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.cab .in2 input{min-height:40px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);font-size:15px;width:100%}
.cab .chk{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cab .chk span{font-size:13.5px;font-weight:600}
.carnet{display:grid;grid-template-columns:62px 1fr 74px 74px;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
.carnet .h{font-size:11.5px;color:var(--muted);font-weight:600}
.carnet input{min-height:40px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);width:100%;font-size:15px}
.carnet b{font-variant-numeric:tabular-nums}
.wknav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.wknav b{flex:1;text-align:center;font-size:15px}
.wkopts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.day{margin-top:16px}
.day h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.day h3 .td{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--or);color:#fff;border-radius:99px;padding:2px 8px}
.day.today h3{color:var(--or-ink)}
.day .none{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.ev{padding:12px 14px;display:flex;flex-direction:column;gap:5px;border-left:4px solid var(--or)}
.ev.m{border-left-color:#2C5C9A}
.ev .tm{font-size:12.5px;font-weight:700;color:var(--or-ink);font-variant-numeric:tabular-nums}
.ev .c{font-weight:600;overflow-wrap:anywhere}
.ev .who{display:flex;flex-wrap:wrap;gap:5px}
.ev .who span{font-size:12px;font-weight:600;background:var(--bg);border-radius:99px;padding:2px 9px}
.ev .who span.me{background:var(--or);color:#fff}
.ev .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cfgbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 12px;border-radius:12px;background:var(--or-soft);color:var(--or-ink);font-size:13.5px;font-weight:600}
.cfgbar button{background:none;border:0;color:var(--or-ink);text-decoration:underline;font-weight:700;cursor:pointer;min-height:32px}
.seg button.on[data-v=C]{background:var(--ok);color:#fff}
.seg button.on[data-v=NC]{background:var(--ko);color:#fff}
.seg button.on[data-v=SO]{background:var(--so);color:#fff}
.seg button.on[data-v=OK]{background:var(--ok);color:#fff}
.seg button.on[data-v=NOK]{background:var(--ko);color:#fff}
.row .obs{flex:1;min-width:160px}
.iconbtn{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:42px;min-width:46px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;position:relative}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--or);color:#fff;font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:700}
.item.isnc{background:linear-gradient(90deg,var(--ko-soft),transparent 70%);margin-inline:-14px;padding-inline:14px}
.photos{margin-top:12px;padding:12px;background:var(--or-soft);border-radius:10px}
.photos h4{margin:0 0 8px;font-size:13px;color:var(--or-ink);display:flex;gap:6px;align-items:center}
.pslots{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pslot{background:var(--card);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pslot .lb{font-size:12.5px;font-weight:500;min-height:2.6em}
.pslot .lb .req{color:var(--ko)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.thumb .up{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center}
.addph{border:1.5px dashed var(--or);color:var(--or-ink);background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chaine{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.chaine .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.cgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.warn{color:var(--ko);font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:14px}
.kv.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cpl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cpl .k{font-size:13.5px}
.cpl .hdr{font-size:11.5px;color:var(--muted);font-weight:600}
@media (max-width:560px){
  .kv,.cpl{grid-template-columns:1fr 1fr}
  .kv .k,.cpl .k{grid-column:1/-1}
  .cpl .hdr{display:none}
}
.ncbox{border-left:4px solid var(--ko);background:var(--ko-soft);border-radius:8px;padding:10px 12px;margin-top:10px;display:grid;gap:8px}
.ncbox .t{font-weight:600;font-size:14px}
h3.sub2{font-size:14px;color:var(--or-ink);margin:16px 0 4px}
.note{font-size:12.5px;color:var(--muted);font-style:italic;margin:6px 0}
.modal .box p{white-space:pre-line}
.frc .frph{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.frc .frim{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.frc .frim.sm{width:72px;height:54px}
.frc .frim img{width:100%;height:100%;object-fit:cover}.frc .frim button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.frc .frad{min-width:96px;height:72px;border:1.5px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:13px}.frc .frrev{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.frc .frrev select{min-height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}.frc .frnc{margin:0 0 10px 18px;padding:0;font-size:13.5px}.frc .frcc{font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.frc .frcc.ok{background:#e3f6e8;color:#1e7a3c}.frc .frcc.co{background:#fdecd8;color:#b54708}
.bet .bet-hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin:14px 0 12px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--or-soft),var(--card) 70%);border:1px solid var(--line);overflow:hidden}
.bet .bet-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--or);opacity:.08}
.bet .bet-hero-ic{width:48px;height:48px;border-radius:14px;background:var(--or);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(239,123,26,.3)}.bet .bet-hero-ic svg{width:26px;height:26px}
.bet .bet-hero h1{margin:2px 0 4px;font-size:22px}.bet .bet-hero p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.bet .bet-cta{grid-column:1/-1;width:100%;min-height:48px;font-size:15.5px;gap:8px;position:relative;z-index:1}.bet .bet-cta svg{width:18px;height:18px}
.bet-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--so-soft);color:var(--so)}.bet-tag svg{width:14px;height:14px}
.bet-tag.ok{background:var(--ok-soft);color:var(--ok)}.bet-tag.co{background:var(--or-soft);color:var(--or-ink)}.bet-tag.ko{background:var(--ko-soft);color:var(--ko)}
.bet .bet-draft{margin:0 0 12px;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px dashed var(--or)}
.bet-draft-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.bet-draft-n{font-size:12px;font-weight:700;color:var(--muted)}
.bet-draft-t{display:block;font-family:var(--f-title);font-size:16px;color:var(--fg)}.bet-draft-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.bet-bar,.pvx-bar{height:6px;border-radius:99px;background:var(--so-soft);overflow:hidden;margin:10px 0}.bet-bar i,.pvx-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or),#f5a25a);transition:width .3s}
.bet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bet-actions .btn{gap:6px}.bet-actions .btn svg{width:16px;height:16px}.bet-del{color:var(--ko)!important}
.bet-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.bet-stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 10px 9px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font:inherit;text-align:left;min-width:0}
.bet-stat b{font-family:var(--f-title);font-size:20px;line-height:1.1;color:var(--fg)}.bet-stat span{font-size:11px;font-weight:600;line-height:1.2}
.bet-stat.ok b{color:var(--ok)}.bet-stat.co b{color:var(--or-ink)}.bet-stat.ko b{color:var(--ko)}
.bet-stat.on{border-color:var(--or);background:var(--or-soft)}.bet-stat:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.bet-tools{display:flex;gap:8px;margin:0 0 12px}.bet-search{flex:1;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.bet-search svg{width:18px;height:18px;color:var(--muted);flex:none}.bet-search input{flex:1;min-width:0;border:0!important;background:transparent!important;outline:0;padding:10px 0!important;box-shadow:none!important;font:inherit;color:var(--fg)}
.bet-rf{width:44px;padding:0!important;justify-content:center}.bet-rf svg{width:18px;height:18px}.bet-rf.spin svg{animation:betspin 1s linear infinite}@keyframes betspin{to{transform:rotate(360deg)}}
.bet-pv{position:relative;margin:0 0 10px;padding:14px 16px 14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.bet-pv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--so)}.bet-pv.ok::before{background:var(--ok)}.bet-pv.co::before{background:var(--or)}.bet-pv.ko::before{background:var(--ko)}
.bet-pv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.bet-pv-top b{font-family:var(--f-title);font-size:16px;line-height:1.25;color:var(--fg)}
.bet-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}.bet-meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}.bet-meta svg{width:14px;height:14px;flex:none;color:var(--or)}
.bet-res{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.4;background:var(--so-soft);color:var(--fg)}.bet-res.co{background:var(--or-soft)}.bet-res.ko{background:var(--ko-soft)}
.bet-empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:30px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px}

<style>
/* v1.1 : barre d'onglets, listes Notion, visionneuse de documents */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;min-width:0;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 2px}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--or-ink)}
.tabbar button[aria-current="page"] svg{color:var(--or)}
.tabbar button:focus-visible{outline:3px solid var(--or);outline-offset:-3px}
.home .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:118px;justify-content:space-between;cursor:pointer;color:var(--fg);font:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s ease,border-color .12s ease}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--or-soft);color:var(--or)}
.tile .ic svg{width:26px;height:26px}
.tile .tx b{display:block;font-family:var(--f-title);font-size:17px;font-weight:700;color:var(--fg);letter-spacing:.01em}
.tile .tx small{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.3}
.tile .go,.tile .lkb{position:absolute;top:14px;right:14px;color:var(--muted)}
.tile .go svg,.tile .lkb svg{width:18px;height:18px}
.tile.t-construction{border-top:4px solid var(--or)}
.tile.t-maintenance{border-top:4px solid var(--gr)}
.tile.t-commun{border-top:4px solid var(--or)}
.tile.t-parametres .ic{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.tile.soon{cursor:default;opacity:.62;border-style:dashed}
.tile.soon .ic{background:var(--line);color:var(--muted)}
.tile .tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.home .whoami{margin-top:18px}
.home .tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:340px){.home .tiles{grid-template-columns:1fr}}
.crumb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0}
.crumb button{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-family:var(--f-title);font-weight:700;font-size:14px;cursor:pointer}
.crumb button svg{width:18px;height:18px;transform:rotate(180deg);color:var(--or)}
.crumb button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.crumb .sec{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-title);font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.crumb .sec svg{width:18px;height:18px;color:var(--or)}
.adk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.adk .k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.adk .k b{display:block;font-family:var(--f-title);font-size:26px;line-height:1.1;color:var(--or)}
.adk .k span{font-size:12px;color:var(--muted)}
.plist{padding:4px 0}
.prow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .dot{width:11px;height:11px;border-radius:50%;flex:none;background:#B7B8BA}
.prow.p-on .dot{background:#2E9E5B;box-shadow:0 0 0 4px rgba(46,158,91,.18)}
.prow.p-recent .dot{background:#EF7B1A}
.prow.p-never .dot{background:transparent;border:1.5px solid #B7B8BA}
.prow .pn{flex:1;min-width:0}
.prow .pn b{display:block;font-size:15px;color:var(--fg)}
.prow .pn small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pst{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.prow.p-on .pst{color:#2E9E5B}
.prow.p-recent .pst{color:var(--or)}
#adRf{display:inline-flex;align-items:center;gap:6px}
#adRf svg{width:16px;height:16px}
.tile.t-admin{border-top:4px solid var(--gr)}
body.on-start .logo-band .in>img{visibility:hidden}
body.on-start .logo-band .slogan{display:none}
.startw{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px!important}
.st-logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin:12px 0 22px}
.st-logo img{width:min(74vw,330px);height:auto}
.st-logo .lg-dk{display:none}
[data-theme="dark"] .st-logo .lg-lt{display:none}
[data-theme="dark"] .st-logo .lg-dk{display:block}
.st-logo span{font-family:var(--f-title);font-weight:700;color:var(--or);font-size:17px}
.startw .login,.startw .login *{box-sizing:border-box}
.login.start{width:100%;max-width:420px;align-self:center;margin:0 auto;padding:24px 20px;gap:14px;border-top:4px solid var(--or)}
.login.start h2{font-size:22px}
.login.start .btn-or{min-height:50px;font-size:16px}
.login .lnk{background:none;border:0;color:var(--or-ink);font:inherit;font-weight:700;font-size:14px;padding:8px 4px;cursor:pointer;text-align:center}
.login .lnk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ct:first-child{border-top:0;padding-top:2px}
.ct-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.ct-l b{font-size:15.5px;color:var(--fg)}
.ct-l .chip{align-self:flex-start;margin-top:2px}
.ct-l small{font-size:13px;color:var(--muted)}
.ct-l .tel{font-size:15px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ct .call{display:inline-flex;align-items:center;gap:6px;flex:none}
.ct .call svg{width:16px;height:16px}
.slist{padding:2px 0}
.srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .sn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .sn b{font-size:14.5px;color:var(--fg);line-height:1.3}
.srow .sn small{font-size:12px;color:var(--muted)}
.srow .sn .chip{align-self:flex-start;margin-top:3px}
.srow .sq{flex:none;text-align:right;min-width:64px}
.srow .sq b{display:block;font-family:var(--f-title);font-size:20px;line-height:1.1;color:var(--fg);font-variant-numeric:tabular-nums}
.srow .sq small{font-size:11.5px;color:var(--muted)}
.srow.s-low .sq b{color:#C26A00}
.srow.s-out .sq b{color:var(--ko)}
.fchips .lowc[aria-pressed="false"]{border-color:#E7B25A;color:#9A5B00}
.imp{padding:14px;display:flex;flex-direction:column;gap:8px}
.imp .ih{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.imp .ih b{font-family:var(--f-title);font-size:15.5px;color:var(--fg);word-break:break-word}
.imp .ip{margin:0;font-size:13.5px;color:var(--fg)}
.imp .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.imp .steps span{height:5px;border-radius:3px;background:var(--line)}
.imp .steps span.on{background:var(--or)}
.imp .dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.imp .dl div{background:var(--bg);border-radius:10px;padding:7px 10px}
.imp .dl span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.imp .dl b{font-size:13.5px;color:var(--fg)}
.imp .dl b.late{color:var(--ko)}
.imp .itr{margin:0;font-size:12.5px;color:var(--muted);word-break:break-word}
.imp .itr span{font-weight:700;margin-right:6px;color:var(--fg)}
.tile.t-logistique{border-top:4px solid var(--or)}
.srow.tap{cursor:pointer}
.srow.tap:active{background:var(--bg)}
.mvm .box{max-height:calc(100vh - 32px);overflow:auto}
.mvh{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.mvh b{font-family:var(--f-title);font-size:17px;color:var(--fg);line-height:1.25}
.mvh small{font-size:12.5px;color:var(--muted)}
.mvs{display:flex;align-items:baseline;gap:6px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.mvs span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:auto}
.mvs b{font-family:var(--f-title);font-size:24px;color:var(--fg)}
.mvs i{font-style:normal;font-size:12.5px;color:var(--muted)}
.mvs em{font-style:normal;font-size:12px;color:var(--muted);margin-left:8px}
.mvs.s-low b{color:#C26A00}.mvs.s-out b{color:var(--ko)}
.mvops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mvop{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;text-align:left;min-height:96px}
.mvop b{font-family:var(--f-title);font-size:15px}
.mvop .i,.mvf h3 .i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;font-weight:700}
.op-sortie{--c:#C2410C;--b:#FDE9DD}.op-entree{--c:#1F7A4A;--b:#DDF3E6}.op-retour{--c:#2C5C9A;--b:#E3ECF8}.op-inventaire{--c:#5B4B8A;--b:#ECE7F7}
.mvop .i,.mvf h3 .i{background:var(--b);color:var(--c)}
.mvop:active{transform:scale(.98)}
.mvf{display:flex;flex-direction:column;gap:12px}
.mvf h3{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-title);font-size:18px}
.mvf .hl{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.mvf label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.mvf input{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--fg);font-size:16px;box-sizing:border-box;width:100%}
.mvf .qrow{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.mvf .qrow input{text-align:center;font-family:var(--f-title);font-size:22px;font-weight:700}
.mvf .qrow .btn{min-height:46px;font-size:22px;padding:0}
.mvf .err{color:var(--ko);font-size:13.5px;font-weight:600;min-height:1.1em}
.ecart{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--bg)}
.ecart.n{color:var(--ko)}.ecart.p{color:#1F7A4A}.ecart.z{color:var(--muted)}
.mvi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;flex:none}
.mv-out .mvi{background:#FDE9DD;color:#C2410C}.mv-in .mvi{background:#DDF3E6;color:#1F7A4A}.mv-inv .mvi{background:#ECE7F7;color:#5B4B8A}
.mv-out .sq b{color:#C2410C}.mv-in .sq b{color:#1F7A4A}
[data-theme="dark"] .op-sortie{--b:#3A2216}[data-theme="dark"] .op-entree{--b:#163024}[data-theme="dark"] .op-retour{--b:#1C2B3D}[data-theme="dark"] .op-inventaire{--b:#29233A}
[data-theme="dark"] .mv-out .mvi{background:#3A2216}[data-theme="dark"] .mv-in .mvi{background:#163024}[data-theme="dark"] .mv-inv .mvi{background:#29233A}
.pch{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--or-ink);background:var(--or-soft);border-radius:10px;padding:7px 10px}
.bil{margin-top:16px;border:1.5px solid var(--or);border-radius:14px;padding:14px;background:var(--card)}
.bil h4{margin:0 0 10px;font-family:var(--f-title);font-size:16px;color:var(--fg)}
.bil .bl{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.bil .bl div{display:grid;grid-template-columns:1fr auto 96px;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.bil .bl span{color:var(--muted)}.bil .bl b{color:var(--fg)}.bil .bl i{font-style:normal;text-align:right;color:var(--fg);font-weight:600}
.bil .bt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bil .bt div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.bil .bt span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bil .bt b{font-family:var(--f-title);font-size:17px;color:var(--or);white-space:nowrap}
.bil .okl{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--ok)}
.cgrp{gap:8px}
.cgrp .top .c{font-size:16.5px}
.cgrp .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip.nb{background:var(--gr);color:#fff}
.cen{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.cgrp.many .cen{border-top:1px dashed var(--line);padding-top:10px}
.cgrp.many .cen:first-of-type{border-top:0;padding-top:0}
.loc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.loc svg{width:18px;height:18px;color:var(--or);flex:none}
.loc b{font-family:var(--f-title);font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--fg)}
.loc span:not(.chip){font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--or);border-radius:999px;padding:2px 9px}
.loc .chip{margin-left:auto}
.loc.big b{font-size:17px}
.oth{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.oth .btn{display:inline-flex;align-items:center;gap:4px}
.oth .btn svg{width:14px;height:14px;color:var(--or)}
.cname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cname span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cname b{font-family:var(--f-title);font-size:15px;color:#2C5C9A}
[data-theme="dark"] .cname b{color:#8DB4E6}
.tvh{padding:14px;display:flex;flex-direction:column;gap:10px}
.tvh label,.tvx-extra label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tvh input,.tvr input{min-height:42px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--card);color:var(--fg);font-size:15px;box-sizing:border-box;width:100%;min-width:0}
.tvh .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.tvh .g3{grid-template-columns:1fr 1fr}.tvh .g3 label:first-child{grid-column:1/-1}}
.tvhd{display:grid;grid-template-columns:1fr 56px 56px 56px;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tvhd span:not(:first-child){text-align:center}
.tvl{padding:2px 0}
.tvr{display:grid;grid-template-columns:1fr 56px 56px 56px;gap:6px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.tvr:first-child{border-top:0}
.tvr .d{display:flex;flex-direction:column;min-width:0}
.tvr .d b{font-size:13.5px;font-weight:600;color:var(--fg);line-height:1.25}
.tvr .d small{font-size:11.5px;color:var(--muted)}
.tvr input{text-align:center;padding:4px;font-weight:700}
.tvr.on{background:var(--or-soft)}
.tvr.on input{border-color:var(--or)}
.tvr.x .d{gap:4px}.tvr.x .d input{text-align:left;font-weight:400;font-size:14px;min-height:38px}
.tvx-extra{padding:14px;margin-top:14px}
.tvbar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:10px 0;background:var(--bg);margin-top:12px}
.tvbar .btn-or{min-width:120px}
.tvstep{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0 10px}
.tvstep span{font-size:11.5px;font-weight:700;text-align:center;padding:6px 4px;border-radius:8px;background:var(--line);color:var(--muted)}
.tvstep span.on{background:var(--or);color:#fff}.tvstep span.ok{background:var(--ok-soft);color:var(--ok)}
.tvhd .ed{color:var(--or)}
.tvr .ro{display:grid;place-items:center;min-height:42px;font-weight:700;font-size:15px;color:var(--fg);background:var(--bg);border-radius:9px}
.tvr.diff .d small em{color:var(--ko);font-style:normal;font-weight:700}
.tvbar{align-items:center}.tvbar .sv{font-size:12px;color:var(--muted);flex:1}.tvbar .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tvh input[readonly]{background:var(--bg);border-color:transparent}
.evpick{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
.evpick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.evpick button b{font-size:14px}.evpick button small{font-size:12px;color:var(--muted)}
.evpick button.used{opacity:.6}
.evpick button:active{border-color:var(--or)}
.tvr.x .d{grid-column:1/-1;display:grid;grid-template-columns:1fr 120px;gap:6px}
.tvr.x>:nth-child(2){grid-column:2}
@media (max-width:360px){.tvr.x .d{grid-template-columns:1fr}}
.tvdays{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;background:var(--or-soft);border-radius:12px;padding:10px 12px}
.tvdays b{grid-row:1/3;font-family:var(--f-title);font-size:30px;line-height:1;color:var(--or)}
.tvdays span{font-family:var(--f-title);font-weight:700;font-size:14.5px;color:var(--fg)}
.tvdays small{font-size:12.5px;color:var(--muted)}
.pxc{margin-top:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px}
.pxc .pxh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pxc .pxh b{font-family:var(--f-title);font-size:15px}
.pxc .dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pxc .dl div{background:var(--bg);border-radius:10px;padding:7px 10px}
.pxc .dl span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.pxc .dl b{font-size:14.5px;color:var(--fg)}.pxc .dl b.pv{color:var(--or)}
.pf h3{font-family:var(--f-title);font-size:18px;margin:0}
.pf h4{margin:6px 0 -4px;font-family:var(--f-title);font-size:14px;color:var(--or)}
.pf .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf select{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--fg);font-size:16px}
.pf .pvest{min-height:46px;display:flex;align-items:center;font-size:14px;color:var(--or);font-weight:700}
.subnav{overflow-x:auto;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:1 0 auto;padding:0 10px;white-space:nowrap}
.subnav{display:flex;gap:6px;margin:14px 0 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.subnav button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.subnav button[aria-current="page"]{background:var(--or);color:#fff}
.subnav button:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.login{max-width:420px;margin:18px auto 0;padding:20px;display:flex;flex-direction:column;gap:12px}
.login .lk{width:44px;height:44px;border-radius:12px;background:var(--or-soft);color:var(--or-ink);display:grid;place-items:center}
.login .lk svg{width:24px;height:24px}
.login h2{margin:0;font-size:18px}
.login p{margin:0;font-size:13.5px;color:var(--muted)}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.login input{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:16px}
.login input:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.login .err{color:var(--ko);font-size:13.5px;font-weight:600;min-height:1.2em}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1;min-width:0}
.whoami{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.whoami button{background:none;border:0;color:var(--or-ink);font-weight:600;font-size:12.5px;cursor:pointer;padding:6px 0;min-height:32px}
.acc-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.g-c{background:var(--or-soft);color:var(--or-ink)}
.chip.g-m{background:#E3ECF8;color:#2C5C9A}
.chip.g-a{background:var(--ko-soft);color:var(--ko)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.g-m{background:#1C2B3D;color:#8DB4E6}}
:root[data-theme="dark"] .chip.g-m{background:#1C2B3D;color:#8DB4E6}
.form{display:flex;flex-direction:column;gap:12px}
.form label.f2{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.form input[type=text],.form input[type=password],.form input:not([type]){min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:16px}
.form .checks{display:flex;flex-wrap:wrap;gap:8px}
.form .checks label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer}
.form .checks input{width:20px;height:20px;accent-color:var(--or)}
.form .err{color:var(--ko);font-size:13.5px;font-weight:600;min-height:1.2em}
.recap{background:var(--ok-soft);border-radius:10px;padding:12px;font-size:14px}
.recap code{font-size:16px;font-weight:700}
.modal .box.wide{max-width:480px;max-height:calc(100vh - 32px);overflow:auto}
.kpis{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.kpis b{color:var(--fg);font-variant-numeric:tabular-nums}
.chip.warn{background:#FFF1C9;color:#7A5300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.warn{background:#3A2F12;color:#F0C966}}
:root[data-theme="dark"] .chip.warn{background:#3A2F12;color:#F0C966}
.icard.tap{cursor:pointer}
.cpvb{max-width:860px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.cpvb .sec{padding:14px;display:flex;flex-direction:column;gap:8px}
.cpvb h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--or-ink)}
.cpvb .hd{padding:16px;display:flex;flex-direction:column;gap:6px}
.cpvb .hd .nm{font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dl div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.dl span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dl b{font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.eq{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.eq:first-of-type{border-top:0}
.eq .t{font-weight:600;font-size:14px}
.eq .m{font-size:12.5px;color:var(--muted)}
.eq details summary{font-size:12.5px;color:var(--or-ink);font-weight:600;cursor:pointer;min-height:28px;display:flex;align-items:center}
.eq .sn{font-size:12.5px;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl .ev:first-child{border-top:0}
.tl .d{font-size:12.5px;font-weight:700;color:var(--or-ink);font-variant-numeric:tabular-nums}
.tl .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tl .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tl .x{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tl .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.fchips button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;min-height:38px;cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#fff}
.icard{padding:14px;display:flex;flex-direction:column;gap:5px}
.icard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.icard .c{font-weight:600;overflow-wrap:anywhere}
.icard .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.icard .m2{font-size:13px;overflow-wrap:anywhere}
.icard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.icard .acts .btn{text-decoration:none}
.chip.s-red{background:var(--ko-soft);color:var(--ko)}
.chip.s-or{background:var(--or-soft);color:var(--or-ink)}
.chip.s-ok{background:var(--ok-soft);color:var(--ok)}
.chip.s-so{background:var(--so-soft);color:var(--so)}
.cat-h{font-size:12.5px;font-weight:700;color:var(--or-ink);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.dbtn{border:1.5px solid var(--or);color:var(--or-ink);background:transparent;border-radius:9px;min-height:40px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dbtn.off::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.more{margin:12px auto 0;display:flex}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:-4px 0 12px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.modal.viewer{display:flex;flex-direction:column;padding:0;align-items:stretch;place-items:stretch;background:var(--bg)}
.vbar{display:flex;align-items:center;gap:6px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line)}
.vbar .vt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.vbar .btn{flex:none}
.vbody{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
.vpage{margin:0 auto 8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.vpage canvas{display:block;width:100%;height:100%}
.vbody img{display:block;margin:0 auto;max-width:none;background:#fff}
.vmsg{padding:40px 16px;text-align:center;color:var(--muted)}
.vfoot{display:flex;gap:8px;justify-content:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
</style>

/* ---------- calculs ---------- */
function stats(f){
  applyCfg(f);
  let tot=0,done=0,nc=0;
  SECTIONS.forEach(s=>{ if(!s.items) return; if(s.so && f.so[s.id]) return;
    s.items.forEach(it=>{tot++; const a=f.ans[it.id]; if(a&&a.s){done++; if(a.s==="NC") nc++;}}); });
  return {tot,done,nc,pct: tot? Math.round(done*100/tot):0};
}
function secCount(f,s){
  if(!s.items) return null;
  if(s.so && f.so[s.id]) return {txt:"Sans objet",cls:""};
  let d=0,n=0; s.items.forEach(it=>{const a=f.ans[it.id]; if(a&&a.s){d++; if(a.s==="NC") n++;}});
  return {txt:`${d}/${s.items.length}`+(n?` · ${n} NC`:""), cls: n?"hasnc":(d===s.items.length?"full":"")};
}
function ncList(f){
  applyCfg(f);
  const out=[]; SECTIONS.forEach(s=>{ if(!s.items||(s.so&&f.so[s.id])) return; s.items.forEach(it=>{ if(f.ans[it.id]?.s==="NC") out.push({s,it}); }); });
  return out;
}

function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      let max=1400, q=0.72, out="";
      for(let k=0;k<8;k++){
        const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q); if(out.length<200000) return res({data:out,w:c.width,h:c.height});
        max=Math.round(max*0.8); q=Math.max(0.5,q-0.05);
      }
      res({data:out,w:0,h:0});
    }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

function nativeCall(fn,...args){ return new Promise(res=>{ const id="cb"+uid(); _cbs[id]=(st,t)=>res({status:st,text:t}); try{ NATIVE[fn](id,...args); }catch(e){ delete _cbs[id]; res({status:-1,text:String(e&&e.message||e)}); } }); }

function notionErr(st,j,t){
  if(st===-1||st===0) return "Pas de connexion internet (ou Notion injoignable).";
  if(st===401) return "Clé Notion refusée : vérifiez-la dans Réglages.";
  if(st===403||st===404) return "Base Notion non partagée avec l'intégration CONEXUN (dans Notion : ••• › Connexions).";
  if(st===413) return "PDF trop lourd pour Notion (limite de l'espace de travail).";
  return (j&&j.message)||t||("Erreur Notion "+st);
}
async function notion(method,path,body){
  if(!NATIVE) throw {message:"Disponible uniquement dans l'appli Android."};
  if(!hasToken()) throw {code:"no_token",message:"Clé Notion non configurée (Réglages)."};
  const r=await nativeCall("http",method,"https://api.notion.com/v1/"+path,body?JSON.stringify(body):"");
  let j=null; try{ j=JSON.parse(r.text); }catch(e){}
  if(r.status<200||r.status>=300) throw {code:"http_"+r.status,message:notionErr(r.status,j,r.text)};
  return j;
}

    let drawing=false, last=null;

    cv.onpointerdown=e=>{drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId);};
    cv.onpointermove=e=>{ if(!drawing) return; const p=pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last=p; };
    cv.onpointerup=cv.onpointercancel=()=>{ if(!drawing) return; drawing=false;
      const o=document.createElement("canvas"); o.width=480; o.height=Math.round(480*r.height/r.width); o.getContext("2d").drawImage(cv,0,0,o.width,o.height);

}

/* ---------- export PDF ---------- */
function pdfName(){ const n=(stripEmoji(cur.client)||"client").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim(); return `Fiche autocontrôle - ${n}.pdf`; }
async function loadAllPhotos(){ if(DB){ try{ const snap=await DB.collection("fiches").doc(curId).collection("photos").get(); snap.docs.forEach(d=>{const v=d.data(); if(v&&!photos[d.id]) photos[d.id]={slot:v.slot,cap:v.cap,data:v.data,pending:false};}); }catch(e){} } }
function ab2b64(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function exportPDF(silent){
  if(!window.jspdf){ toast("Le générateur PDF ne s'est pas chargé."); return false; }
  const btn=$("#pdf"); if(btn){btn.disabled=true; btn.textContent="Création…";} let ok=false;
  try{
    await loadAllPhotos(); await ensurePdfFonts();
    const buf=buildPDF().output("arraybuffer");
    if(NATIVE){
      const r=await nativeCall("savePdf",ab2b64(buf),pdfName());
      ok=r.status===200;
      if(!ok) toast("Enregistrement impossible : "+r.text);
      else if(!silent) pdfSavedModal(r.text);
      else toast("PDF enregistré dans Téléchargements/CONEXUN.");
    } else {
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([buf],{type:"application/pdf"})); a.download=pdfName(); document.body.appendChild(a); a.click(); a.remove(); ok=true;
    }
  }catch(e){ toast("Export impossible : "+((e&&e.message)||e)); }
  const b2=$("#pdf"); if(b2){b2.disabled=false; b2.textContent="PDF";}
  return ok;
}
function pdfSavedModal(uri){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><p><b>PDF enregistré</b></p><p style="font-size:13px">${esc(pdfName())}<br>Dossier : Téléchargements / CONEXUN</p>
   <div style="display:grid;gap:8px"><button class="btn btn-or" id="pOpen">Ouvrir</button><button class="btn btn-ghost" id="pShare">Partager</button><button class="btn btn-ghost btn-sm" id="pClose">Fermer</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#pOpen").onclick=()=>{ NATIVE.openPdf(uri); m.remove(); };
  m.querySelector("#pShare").onclick=()=>{ NATIVE.sharePdf(uri); m.remove(); };
  m.querySelector("#pClose").onclick=()=>m.remove();
}

  const b=Array.from(new TextEncoder().encode(str)); const l=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0); for(let i=7;i>=0;i--) b.push(Math.floor(l/Math.pow(2,i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const r=(x,n)=>(x>>>n)|(x<<(32-n)); const W=new Array(64);

function pwDerive(salt,pw){ let h=sha256hex(salt+":"+pw); for(let i=0;i<2000;i++) h=sha256hex(salt+h); return h; }
function pwHash(pw){ const a=new Uint8Array(8); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<8;i++) a[i]=Math.floor(Math.random()*256); }
  const salt=Array.from(a).map(x=>x.toString(16).padStart(2,"0")).join(""); return "h1$"+salt+"$"+pwDerive(salt,pw); }

let GUEST=false;
function renderLogin(g){
  const need=GROUP_LOCK[g]; const START=g==="start"; document.body.classList.toggle("on-start",START);
  const other=SESSION?`<p>Le compte <b>${esc(SESSION.nom||SESSION.login)}</b> n'a pas accès à ${need==="Admin"?"Paramètres":esc(need)}. Connectez-vous avec un autre compte.</p>`:"";
  $("#app").innerHTML=`<div class="wrap${START?" startw":""}">${START?`<div class="st-logo"><img class="lg-lt" alt="CONEXUN — Installation et maintenance photovoltaïque" src="${LOGO_LT}"><img class="lg-dk" alt="" aria-hidden="true" src="${LOGO_DK}"><span>Connectez-vous au soleil !</span></div>`:""}<form class="card login${START?" start":""}" id="lgF" novalidate>
    ${START?`<h2>Connexion</h2><p>Entrez l'identifiant et le mot de passe donnés par votre responsable.</p>`:`<div class="lk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>${g==="admin"?"Administrateur":need==="Admin"?"Paramètres":esc(need)}</h2><p>${need==="Admin"?"Réservé aux administrateurs.":"Accès réservé."} Entrez l'identifiant et le mot de passe donnés par votre responsable.</p>${other}`}
    <label for="lgId">Identifiant<input id="lgId" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(lsGet("cx_last_login")||"")}"></label>
    <label for="lgPw">Mot de passe<span class="pwrow"><input id="lgPw" type="password" autocomplete="current-password"><button type="button" class="btn btn-ghost btn-sm" id="lgEye" aria-label="Afficher le mot de passe">Voir</button></span></label>
    <span class="err" id="lgErr" role="alert"></span>
    <button class="btn btn-or" id="lgGo" type="submit">Se connecter</button>
    ${hasToken()?"":`<button type="button" class="btn btn-ghost btn-sm" id="lgSet">Première installation : coller la clé Notion</button>`}
    
  </form></div>`;
  const f=$("#lgF"), err=t=>{ $("#lgErr").textContent=t; };
  $("#lgEye").onclick=()=>{ const i=$("#lgPw"); const show=i.type==="password"; i.type=show?"text":"password"; $("#lgEye").textContent=show?"Masquer":"Voir"; };
  const lo=$("#lgOut"); if(lo) lo.onclick=logout;
  const ls=$("#lgSet"); if(ls) ls.onclick=openSettings;
  f.onsubmit=async e=>{ e.preventDefault();
    const id=$("#lgId").value.trim(), pw=$("#lgPw").value;
    if(!id||!pw){ err("Entrez l'identifiant et le mot de passe."); return; }
    if(Date.now()<loginWait){ err("Trop d'essais. Réessayez dans "+Math.ceil((loginWait-Date.now())/1000)+" s."); return; }
    const nr=notionReady(); if(nr){ err(nr==="no_token"?"Clé Notion non configurée sur cet appareil : ouvrez « Réglages » ci-dessous.":nr); return; }
    const b=$("#lgGo"); b.disabled=true; b.textContent="Vérification…"; err("");
    try{
      let pg=null, stPw="";
      if(WEB){ const r=await webCall("/login",{login:id,password:pw}); let j=null; try{ j=JSON.parse(r.text); }catch(e){}
        if(r.status===200&&j&&j.token&&j.page){ wls.set("cx_wtok",j.token); pg=j.page; stPw="h1$web"; } else if(r.status!==401) throw {message:(j&&j.message)||"Serveur relais injoignable."}; }
      else{ let all=[], cursor=null;
      do{ const j=await notion("POST","databases/"+ACCES_DB+"/query",Object.assign({page_size:100,filter:{property:"Actif",checkbox:{equals:true}}},cursor?{start_cursor:cursor}:{}));
        all=all.concat(j.results||[]); cursor=j.has_more?j.next_cursor:null; }while(cursor);
      pg=all.find(x=>ptxt((x.properties||{})["Identifiant"]).trim().toLowerCase()===id.toLowerCase());
      stPw=pg?ptxt(pg.properties["Mot de passe"]):""; }
      if(!pg||(!WEB&&!pwCheck(stPw,pw))){ loginFails++; if(loginFails>=5){ loginWait=Date.now()+30000; loginFails=0; } err("Identifiant ou mot de passe incorrect."); b.disabled=false; b.textContent="Se connecter"; return; }
      const groupes=pmulti(pg.properties["Groupes"]);
      if(need&&!groupes.includes(need)&&!groupes.includes("Admin")){ err(need==="Admin"?"Ce compte n'est pas administrateur.":"Ce compte n'a pas accès à "+need+"."); b.disabled=false; b.textContent="Se connecter"; return; }
      if(!WEB&&!stPw.startsWith("h1$")) notion("PATCH","pages/"+pg.id,{properties:{"Mot de passe":rt(pwHash(pw))}}).catch(()=>{});
      loginFails=0; SESSION={id:pg.id,login:ptxt(pg.properties["Identifiant"]).trim(),nom:ptxt(pg.properties["Nom"]).trim()||id,groupes,at:Date.now()};
      lsSet("cx_session",SESSION); lsSet("cx_last_login",SESSION.login); toast("Bonjour "+SESSION.nom+" !"); renderList(); beat(true); setTimeout(()=>bkRestore().catch(()=>{}),1500);
    }catch(e2){ err(e2&&e2.code==="http_404"?"Base « Accès appli » non connectée à l'intégration CONEXUN dans Notion.":((e2&&e2.message)||"Erreur Notion")); b.disabled=false; b.textContent="Se connecter"; }
  };
  setTimeout(()=>{ const i=$("#lgId"); (i&&i.value?$("#lgPw"):i).focus(); },50);
}


const HOME_TILES=[
  ["construction","Construction","Planning · Fiches · Travaux · Rapports"],
  ["maintenance","Maintenance","Planning · Supervision des centrales"],
  ["logistique","Logistique","Planning · Fiches travaux · Stock · Arrivages"],
  ["commun","Base de données","CPV · Docs techniques"],
  ["bet","BET","PV de réception des chantiers terminés"],
  ["compta","Gestion comptabilité","Rentabilité des chantiers · Devis · Main-d'œuvre"],
  ["admin","Administrateur","Activité · Fiches à valider · Comptes · Réglages"],
  ["compte","Mon compte","Mes infos · Mot de passe · Mes fiches sauvegardées"]];
function openGroup(k){ const g=GROUPS.find(x=>x[0]===k); if(!g) return; const ls=lastSub[k]; switchTab(ls&&g[2].some(x=>x[0]===ls)?ls:g[2][0][0]); }
function renderHome(){
  const h=new Date().getHours(); const hello=h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
  const who=SESSION?(SESSION.nom||SESSION.login):"";
  $("#app").innerHTML=`<div class="wrap home">
    <h1>${hello}${who?" "+esc(who.split(" ").slice(-1)[0]):""} !</h1>
    <p class="sub">Choisissez une section.</p>
    <div class="tiles">${HOME_TILES.filter(([k,l,d,soon])=>soon?isAdmin():canEnter(k)).map(([k,l,d,soon])=>{ const lk=!soon&&!canEnter(k);
      return `<button class="tile ${soon?"soon":""} t-${k}" ${soon?'disabled aria-disabled="true"':`data-go="${k}"`}>
        <span class="ic">${ICO[k]}</span>
        <span class="tx"><b>${l}</b></span>
        ${soon?`<span class="tag">Bientôt</span>`:lk?`<span class="lkb" aria-label="Accès protégé">${ICO.lock}</span>`:`<span class="go">${ICO.chev}</span>`}
      </button>`; }).join("")}</div>
    ${SESSION?`<div class="whoami"><span>Connecté : <b>${esc(who)}</b></span></div>`:`<div class="whoami"><span>Sans compte</span><button id="wIn">Se connecter</button></div>`}
  </div>`;
  $("#app").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>openGroup(b.dataset.go));
  const o=$("#wOut"); if(o) o.onclick=logout;
  const wi=$("#wIn"); if(wi) wi.onclick=()=>{ GUEST=false; renderList(); };
}

const PRODUITS_DS="843d8f65-eb23-4151-be6f-77cfe7af9862";   // 📚 Catalogue CONEXUN › 📦 Produits (data source)
const ACHATS_DS="547c0468-025a-405a-8541-7cbfc68c7791";     // 📚 Catalogue CONEXUN › 🧾 Historique achats (data source)
const IMPORT_DB="22e6c1f928ca809cbfaad769a9316461";        // Importations de Matériel
const L={prod:lsGet("cx_prod"),imp:null,ach:null,err:{},q:"",cat:"",low:false,done:false,at:0,loading:false};
const IMP_STEPS=["Commandé","En Transit International","Arrivé au Port","En Dédouanement","En Transit Local","Livré"];
const pformNum=p=>p&&p.type==="formula"&&p.formula&&p.formula.type==="number"?p.formula.number:null;
async function dsQueryAll(ds,body){ let all=[],cursor=null; do{ const j=await notion("POST","data_sources/"+ds+"/query",Object.assign({page_size:100},body||{},cursor?{start_cursor:cursor}:{})); all=all.concat(j.results||[]); cursor=j.has_more?j.next_cursor:null; }while(cursor&&all.length<1000); return all; }
function prodRow(pg){ const P=pg.properties||{}; const real=pformNum(P["Stock réel"]); const st=real!=null?real:pnum(P["Stock actuel"]);
  return {id:pg.id,name:ptxt(P["Produit"]).replace(/\s+/g," ").trim()||"Sans nom",sku:ptxt(P["Référence (SKU)"]),cat:ptxt(P["Catégorie"])||"Divers",marque:ptxt(P["Marque"]),unit:ptxt(P["Unité"]),stock:st,seuil:pnum(P["Seuil mini"]),stockBase:pnum(P["Stock actuel"]),
    cost:pnum(P["Coût unitaire HT"]),marge:pnum(P["Taux de marge %"]),tva:pnum(P["TVA %"]),pv:pformNum(P["Prix de vente HT"]),cr:pformNum(P["Coût de revient HT"]),pmp:pformNum(P["PMP achat HT"]),last:pformNum(P["Dernier prix achat HT"])}; }
function impRow(pg){ const P=pg.properties||{};
  return {id:pg.id,num:ptxt(P["N° Commande"])||"Commande",prod:ptxt(P["Produits"]),etat:ptxt(P["État"]),cmd:pdate(P["Date de Commande"]),prev:pdate(P["Date d'Arrivée Prévue"]),reel:pdate(P["Date d'Arrivée Réelle"]),
    dep:pdate(P["Date dépotage"]),trans:ptxt(P["Transporteur"]),track:ptxt(P["Tracking"]),pays:ptxt(P["Pays d'Origine"]),note:ptxt(P["Note"])}; }
function achRow(pg){ const P=pg.properties||{}; const four=ptxt(P["Fournisseur"])||ptxt(P["Fournisseur (optionnel)"]);
  return {id:pg.id,doc:ptxt(P["Facture / BL"]),four,qty:pnum(P["Quantité achetée"]),date:pdate(P["Date d’achat"]),prods:prel(P["Produit"]),notes:ptxt(P["Notes"])}; }
async function loadLogi(force){
  const nr=notionReady(); if(nr) return;
  if(L.loading||(!force&&L.at&&Date.now()-L.at<5*60e3)) return;
  L.loading=true; drawLogi();
  const [p,i,a]=await Promise.allSettled([
    dsQueryAll(PRODUITS_DS,{filter:{and:[{property:"Suivi en stock",checkbox:{equals:true}},{property:"Actif",checkbox:{equals:true}}]},sorts:[{property:"Produit",direction:"ascending"}]}),
    queryAll(IMPORT_DB,undefined),

function valPad(cv){ const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr); x.lineWidth=2.2; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#1d1d1f"; x.fillStyle="#fff"; x.fillRect(0,0,r.width,r.height);
  const st={drawn:false}; let dr=false,last=null; const pos=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  cv.onpointerdown=e=>{ dr=true; last=pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=e=>{ if(!dr) return; const p=pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last=p; st.drawn=true; };
  cv.onpointerup=cv.onpointercancel=()=>{ dr=false; };
  st.clear=()=>{ x.save(); x.setTransform(1,0,0,1,0,0); x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height); x.restore(); st.drawn=false; };
  st.img=()=>{ const o=document.createElement("canvas"); o.width=480; o.height=Math.round(480*r.height/r.width); const ox=o.getContext("2d"); ox.fillStyle="#fff"; ox.fillRect(0,0,o.width,o.height); ox.drawImage(cv,0,0,o.width,o.height); return o.toDataURL("image/jpeg",0.75); };
  return st; }

}

async function openDoc(d){

  if(!NATIVE){ fail("Disponible uniquement dans l'appli Android."); return; }

    if(!alive()) return;

    m.querySelector('[data-v="in"]').style.display=isImg?"":"none"; m.querySelector('[data-v="out"]').style.display=isImg?"":"none";
    let blobUrl=""; try{ const api=await webApi(); const r=await fetch(api+"/file",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+wls.get("cx_wtok")},body:JSON.stringify({url})});
      if(r.ok) blobUrl=URL.createObjectURL(await r.blob()); }catch(e){}
    if(!alive()) return;
    const src=blobUrl||url;
    if(blobUrl) foot.querySelector("a[download]").href=blobUrl;
    if(isImg){ body.innerHTML=`<img alt="${esc(d.name)}" src="${esc(src)}">`; const img=body.querySelector("img"); redraw=()=>{ img.style.width=(100*zoom)+"%"; }; redraw(); return; }
    if(isPdf){ body.innerHTML=`<iframe title="${esc(d.title||d.name)}" src="${esc(src)}" style="width:100%;height:100%;min-height:70vh;border:0;background:#fff"></iframe>`; return; }
    body.innerHTML=`<div class="vmsg">Ce type de fichier (.${esc(ext)}) ne s'affiche pas ici.<br><br><a class="btn btn-or" href="${esc(src)}" target="_blank" rel="noopener" download="${esc(d.saveName||d.name||"document")}">Ouvrir / télécharger</a></div>`; return; }
  let local="";
  try{
    local=NATIVE.cached(d.key)||"";
    if(!local){
      const url=await freshFileUrl(d); if(!url) throw new Error("Document introuvable dans Notion.");

      if(r.status!==200) throw new Error(r.status===-1?"Pas de connexion internet : ce document n'a pas encore été téléchargé sur l'appareil.":r.text);

    let gen=0; const done=new Map();
    const baseW=()=>Math.max(200,body.clientWidth-16);
    const size=()=>{ const w=baseW()*zoom; pages.forEach(el=>{ el.style.width=w+"px"; if(!el.dataset.h) el.style.height=(w*ratio)+"px"; }); };
    const draw=async el=>{ const g=gen; const n=+el.dataset.p; if(done.get(n)===g) return; done.set(n,g);
      try{ const pg=await pdf.getPage(n); if(g!==gen||!alive()) return; const vw=pg.getViewport({scale:1}); const w=baseW()*zoom; const dpr=Math.min(window.devicePixelRatio||1,2);
        const vp=pg.getViewport({scale:w/vw.width*dpr}); const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);

      }catch(e){ done.delete(n); } };
    const near=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) draw(e.target); }),{root:body,rootMargin:"900px 0px"});
    const far=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting){ const n=+e.target.dataset.p; if(done.has(n)){ done.delete(n); e.target.innerHTML=""; } } }),{root:body,rootMargin:"4000px 0px"});
    pages.forEach(el=>{ near.observe(el); far.observe(el); });
    redraw=()=>{ gen++; done.clear(); pages.forEach(el=>{ el.innerHTML=""; delete el.dataset.h; }); size(); pages.forEach(el=>{ near.unobserve(el); near.observe(el); }); };
    size();
    const obs=new MutationObserver(()=>{ if(!alive()){ near.disconnect(); far.disconnect(); obs.disconnect(); pdf.destroy(); } }); obs.observe(document.body,{childList:true});
  }catch(e){ fail("Lecture du PDF impossible ("+((e&&e.message)||"erreur")+"). Essayez « Ouvrir avec… »."); }
}

function geoFrom(text){

  if(m){ let la,lo; if(m.length===3){ la=+m[1]; lo=+m[2]; } else { la=+m[1]; lo=+m[3]; if(m[2]&&/s/i.test(m[2])&&la>0) la=-la; if(m[4]&&/[ow]/i.test(m[4])&&lo>0) lo=-lo; }
    if(Math.abs(la)<=90&&Math.abs(lo)<=180&&!(la===0&&lo===0)) return {lat:la,lng:lo}; }
  return null; }

const PLAN_TYPES={plan_c:["1 - Chantier","9 - Test de découplage"],plan_m:["2 - Maintenance","3 - Intervention"],plan_l:["5 - Logistique"]};
const W={off:0,cache:{},loading:false,err:"",mine:!!lsGet("cx_mine")};
function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7); return d; }
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
function planRow(pg){ const P=pg.properties||{}; const dt=(P["Date / Heure"]||{}).date||{};
  const roll=(p,k)=>p&&p.type==="rollup"&&p.rollup&&Array.isArray(p.rollup.array)?p.rollup.array.map(x=>x[k]).filter(Boolean):[];
  return {id:pg.id,url:pg.url||nurl(pg.id),title:stripEmoji(ptxt(P["Événement"]))||"Sans titre",type:ptxt(P["Type"]),start:dt.start||"",end:dt.end||"",tech:pmulti(P["Technicien"]),
    notes:ptxt(P["Notes"]),autre:ptxt(P["Autre"]),valid:ptxt(P["Validation"]),etat:ptxt(P["État"]),client:prel(P["Client"])[0]||"",gps:roll(P["Point GPS"],"url")[0]||"",tel:roll(P["Téléphone"],"phone_number")[0]||"",
    chantier:prel(P["👷 Suivi de Chantier"])[0]||prel(P["👷 Chantier synchronisé"])[0]||""}; }
async function loadWeek(kind,force){
  const key=kind+"|"+W.off; if(W.cache[key]&&!force){ drawWeek(kind); return; }
  if(notionReady()){ drawWeek(kind); return; }
  W.loading=true; W.err=""; drawWeek(kind);
  const mon=weekStart(W.off), sun=addDays(mon,6), from=addDays(mon,-14);
  try{ let all=[],cursor=null;
    do{ const j=await notion("POST","databases/"+PLAN_DB+"/query",Object.assign({page_size:100,sorts:[{property:"Date / Heure",direction:"ascending"}],
        filter:{and:[{or:PLAN_TYPES[kind].map(t=>({property:"Type",select:{equals:t}}))},{property:"Date / Heure",date:{on_or_after:ymd(from)}},{property:"Date / Heure",date:{on_or_before:ymd(sun)}}]}},cursor?{start_cursor:cursor}:{}));
      all=all.concat(j.results||[]); cursor=j.has_more?j.next_cursor:null; }while(cursor&&all.length<600);
    W.cache[key]=all.map(planRow).filter(e=>PLAN_TYPES[kind].includes(e.type)&&e.valid!=="Annulé"&&e.start&&(e.end||e.start).slice(0,10)>=ymd(mon)&&e.start.slice(0,10)<=ymd(sun));
    resolveClientNames(W.cache[key].filter(e=>e.client).map(e=>({clients:[e.client]})));
  }catch(e){ W.err=(e&&e.message)||"Erreur Notion"; }
  W.loading=false; if(tab===kind&&!cur) drawWeek(kind);
}
function renderWeek(kind){
  const mon=weekStart(W.off), sun=addDays(mon,6);
  const fmt=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  $("#app").innerHTML=`<div class="wrap">${headerHTML("Planning de la semaine",kind==="plan_c"?"Chantiers et tests de découplage prévus dans Notion.":kind==="plan_l"?"Livraisons, enlèvements et tâches logistiques prévus dans Notion.":"Maintenances et interventions prévues dans Notion.")}
    <div class="wknav"><button class="btn btn-ghost btn-sm" id="wPrev" aria-label="Semaine précédente">←</button><b>Semaine du ${esc(fmt(mon))} au ${esc(fmt(sun))}</b><button class="btn btn-ghost btn-sm" id="wNext" aria-label="Semaine suivante">→</button></div>
    <div class="wkopts">${W.off?`<button class="btn btn-ghost btn-sm" id="wNow">Cette semaine</button>`:""}<button class="btn btn-ghost btn-sm" id="wRef">Actualiser</button>
      ${SESSION?`<div class="fchips" style="margin:0"><button id="wMine" aria-pressed="${W.mine}">Seulement moi</button></div>`:""}</div>
    <div id="wRes"></div></div>`;

  $("#wNext").onclick=()=>{ W.off++; renderList(); };

function isMe(t){ if(!SESSION) return false; const toks=(String(SESSION.nom||"")+" "+String(SESSION.login||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[\s._-]+/);
  return toks.includes(String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")); }
function drawWeek(kind){
  const el=$("#wRes"); if(!el) return;
  const nr=notionReady(); if(nr){ el.innerHTML=notReadyHTML(nr); bindCommon(el); return; }
  const items=W.cache[kind+"|"+W.off];
  let h=W.err?`<div class="card empty" style="margin-bottom:10px"><b>Planning indisponible</b>${esc(W.err)}</div>`:"";
  if(!items){ el.innerHTML=h+(W.loading?`<div class="card empty">Lecture du planning dans Notion…</div>`:""); return; }
  const mon=weekStart(W.off), today=ymd(new Date());
  const list=W.mine&&SESSION?items.filter(e=>e.tech.some(isMe)):items;
  for(let i=0;i<7;i++){ const d=addDays(mon,i), k=ymd(d);
    const evs=list.filter(e=>e.start.slice(0,10)<=k&&(e.end||e.start).slice(0,10)>=k).sort((a,b)=>a.start.localeCompare(b.start));
    if(i>=5&&!evs.length) continue;
    h+=`<div class="day ${k===today?"today":""}"><h3>${esc((t=>t.charAt(0).toUpperCase()+t.slice(1))(d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})))}${k===today?`<span class="td">Aujourd'hui</span>`:""}</h3>`;
    h+=evs.length?`<div class="list">${evs.map(e=>{ const ix=items.indexOf(e); const multi=e.end&&e.end.slice(0,10)!==e.start.slice(0,10);
      const tm=e.start.includes("T")&&e.start.slice(0,10)===k?e.start.slice(11,16).replace(":","h"):multi?"Sur plusieurs jours":"Journée";
      const cn=e.client&&clientNames[e.client.replace(/-/g,"")]; const g=e.gps?(geoFrom(e.gps)?dirUrl(geoFrom(e.gps).lat+","+geoFrom(e.gps).lng):(String(e.gps).match(/https?:\/\/\S+/)||[])[0]):"";
      const fiche=kind==="plan_c"?fiches.find(f=>f.notion&&f.notion.eventUrl===e.url):null;
      return `<div class="card ev ${kind==="plan_m"?"m":""}"><span class="tm">${esc(tm)}${e.type&&kind==="plan_m"?" · "+esc(e.type.replace(/^\d+ - /,"")):""}</span>
        <span class="c">${esc(e.title)}</span>${cn&&cn!=="?"&&!e.title.toLowerCase().includes(cn.toLowerCase().split(" ")[0])?`<span class="m" style="font-size:13px;color:var(--muted)">Client : ${esc(cn)}</span>`:""}
        ${e.tech.length?`<div class="who">${e.tech.map(t=>`<span class="${isMe(t)?"me":""}">${esc(t)}</span>`).join("")}</div>`:`<span class="m" style="font-size:12.5px;color:var(--muted)">Équipe non définie</span>`}
        <div class="acc-chips">${e.valid?`<span class="chip ${e.valid==="Validé"?"s-ok":"s-or"}">${esc(e.valid)}</span>`:""}${e.etat&&e.etat!=="Pas commencé"?`<span class="chip ${e.etat==="Terminé"?"s-so":"s-or"}">${esc(e.etat)}</span>`:""}</div>
        ${e.notes||e.autre?`<span class="m" style="font-size:13px">${esc([e.notes,e.autre].filter(Boolean).join(" · "))}</span>`:""}
        <div class="acts">${kind==="plan_c"?`<button class="btn ${fiche?"btn-ghost":"btn-or"} btn-sm" data-wf="${ix}">${fiche?"Ouvrir la fiche":"Démarrer la fiche"}</button>`:""}${g?`<button class="btn btn-ghost btn-sm" data-url="${esc(g)}">Itinéraire</button>`:""}</div></div>`; }).join("")}</div>`
      :`<div class="none">Rien de prévu${W.mine?" pour vous":""}.</div>`;
    h+=`</div>`; }
  if(W.loading) h+=`<div class="vmsg">Mise à jour…</div>`;
  el.innerHTML=h; bindCommon(el);
  el.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{ const e=items[+b.dataset.wf];
    ficheFromPlan({url:e.url,title:e.title,start:e.start.slice(0,10),tech:e.tech,notes:e.notes,chantier:e.chantier?nurl(e.chantier):""}); });

/* ---------- stockage local (IndexedDB) ---------- */
function makeLocalDB(){
  const L={ls:[]};
  L.ready=new Promise((res,rej)=>{ const rq=indexedDB.open("conexun_autocontrole",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("kv");
    rq.onsuccess=()=>{ L.idb=rq.result; res(); }; rq.onerror=()=>rej(rq.error); });
  const tx=(mode,fn)=>new Promise((res,rej)=>{ const t=L.idb.transaction("kv",mode); const st=t.objectStore("kv"); const out=fn(st); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); });
  const get=k=>tx("readonly",st=>st.get(k));
  const put=(k,v)=>tx("readwrite",st=>st.put(v,k));
  const del=k=>tx("readwrite",st=>st.delete(k));
  const list=prefix=>new Promise((res,rej)=>{ const out=[]; const t=L.idb.transaction("kv","readonly"); const rq=t.objectStore("kv").openCursor(IDBKeyRange.bound(prefix,prefix+"￿"));
    rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push({k:c.key,v:c.value}); c.continue(); } else res(out); }; rq.onerror=()=>rej(rq.error); });
  const emit=path=>{ const parent=path.split("/").slice(0,-1).join("/"); L.ls.filter(l=>l.col===parent).forEach(l=>l.run()); };
  class Doc{ constructor(p){ this.path=p; this.id=p.split("/").pop(); }
    async set(d){ await L.ready; await put(this.path,JSON.parse(JSON.stringify(d))); emit(this.path); }
    async get(){ await L.ready; const v=await get(this.path); return {id:this.id,exists:v!==undefined,data:()=>v}; }
    async delete(){ await L.ready; await del(this.path); const sub=await list(this.path+"/"); for(const r of sub) await del(r.k); emit(this.path); }
    collection(n){ return new Col(this.path+"/"+n); } }
  class Col{ constructor(p){ this.path=p; }
    doc(id){ return new Doc(this.path+"/"+(id||uid())); }
    orderBy(){ return this; } limit(){ return this; }
    async get(){ await L.ready; const depth=this.path.split("/").length+1; const rows=(await list(this.path+"/")).filter(r=>r.k.split("/").length===depth);
      const docs=rows.map(r=>({id:r.k.split("/").pop(),exists:true,data:()=>r.v})); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map(d=>({type:"added",doc:d}))}; }
    onSnapshot(next,err){ const l={col:this.path,run:async()=>{ try{ next(await this.get()); }catch(e){ err&&err(e); } }}; L.ls.push(l); l.run(); return ()=>{ L.ls=L.ls.filter(x=>x!==l); }; } }
  L.collection=p=>new Col(p); L.doc=p=>new Doc(p);
  return L;
}

async function bkPush(id,f){

  const map=lsGet("cx_bkmap")||{}; let pid=map[id];
  if(!pid){ const j=await notion("POST","databases/"+BK_DB+"/query",{page_size:1,filter:{property:"Fiche ID",rich_text:{equals:id}}}); if(j.results&&j.results[0]) pid=j.results[0].id; }

async function bkDelete(id){ const map=lsGet("cx_bkmap")||{}; const pid=map[id]; if(!pid||notionReady()) return; try{ await notion("PATCH","pages/"+pid,{properties:{"Supprimée":{checkbox:true}}}); delete map[id]; lsSet("cx_bkmap",map); }catch(e){} }
async function bkRestore(show){
  if(!SESSION||!DB||notionReady()) return 0;
  let all=[],cursor=null; do{ const j=await notion("POST","databases/"+BK_DB+"/query",Object.assign({page_size:100,filter:{and:[{property:"Compte",relation:{contains:SESSION.id}},{property:"Supprimée",checkbox:{equals:false}}]}},cursor?{start_cursor:cursor}:{})); all=all.concat(j.results||[]); cursor=j.has_more?j.next_cursor:null; }while(cursor&&all.length<300);
  const map=lsGet("cx_bkmap")||{}; let n=0;
  for(const pg of all){ const P=pg.properties||{}; const id=ptxt(P["Fiche ID"]); if(!id) continue; map[id]=pg.id; let d=null; try{ d=JSON.parse(ptxt(P["Données"])); }catch(e){} if(!d) continue;
    const loc=fiches.find(x=>x._id===id); if(loc&&(loc.updatedAt||0)>=(d.updatedAt||0)) continue;
    if(cur&&curId===id) continue; await DB.collection("fiches").doc(id).set(d); n++; }
  lsSet("cx_bkmap",map); BK.restored=true; if(n&&show!==false) toast(n+" fiche(s) récupérée(s) depuis votre sauvegarde Notion."); return n; }
async function bkAll(){ let n=0; for(const f of fiches){ const d=Object.assign({},f); const id=d._id; delete d._id; if((d.createdBy&&MYID&&d.createdBy!==MYID)) {} try{ if(await bkPush(id,d)) n++; }catch(e){} } return n; }

    otaBanner(`Nouvelle version de l'application à installer${o.v.apkName?" ("+esc(o.v.apkName)+")":""}.`,"Télécharger",()=>openUrl(o.v.apkUrl)); },4000); }

renderList();
(async()=>{
  CANEDIT=true; DL=true;
  MCP=NATIVE?{native:true}:null;
  try{ const L=makeLocalDB(); await L.ready; DB=L; }catch(e){ DB=null; toast("Stockage indisponible : les fiches ne seront pas conservées."); }

  if(typeof WEB!=="undefined"&&WEB&&!window.__cxPop){ window.__cxPop=1; try{ history.pushState({cx:1},""); }catch(e){}
